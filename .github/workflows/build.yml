name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Android 骨架（保留仓库预置 Manifest）
        run: |
          flutter create --platforms=android --org com.anglesgirl --project-name netbox .
          grep -E "uses-permission|usesCleartextTraffic|label|MainActivity" android/app/src/main/AndroidManifest.xml

      - name: 依赖
        run: flutter pub get

      - name: 构建 APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: netbox-apk
          path: build/app/outputs/flutter-apk/*.apk
