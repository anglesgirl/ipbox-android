name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Android 骨架
        run: |
          flutter create --platforms=android --org com.anglesgirl --project-name netbox .
          # 注入网络权限 + 明文 HTTP + 中文应用名
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="netbox"|android:label="网络工具箱" android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          grep -E "uses-permission|usesCleartextTraffic|label" android/app/src/main/AndroidManifest.xml

      - name: 依赖
        run: flutter pub get

      - name: 构建 APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: netbox-apk
          path: build/app/outputs/flutter-apk/*.apk
